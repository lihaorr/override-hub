# ==========================
# 分流规则 rules
# ==========================
rules:
  ### WhatsApp / LINE / TikTok / AI 跟随「节点选择」

  # WhatsApp
  - DOMAIN-SUFFIX,whatsapp.com,节点选择
  - DOMAIN-SUFFIX,whatsapp.net,节点选择
  - DOMAIN-SUFFIX,wa.me,节点选择
  - DOMAIN-KEYWORD,whatsapp,节点选择

  # LINE
  - DOMAIN-SUFFIX,line.me,节点选择
  - DOMAIN-SUFFIX,line-apps.com,节点选择
  - DOMAIN-SUFFIX,line-scdn.net,节点选择
  - DOMAIN-SUFFIX,lin.ee,节点选择
  - DOMAIN-KEYWORD,line,节点选择

  # TikTok / TikTok Shop
  - DOMAIN-KEYWORD,tiktok,节点选择
  - DOMAIN-KEYWORD,tiktokshopglobalselling,节点选择
  - DOMAIN-SUFFIX,tiktok.com,节点选择
  - DOMAIN-SUFFIX,tiktokv.com,节点选择
  - DOMAIN-SUFFIX,tiktokcdn.com,节点选择
  - DOMAIN-SUFFIX,muscdn.com,节点选择
  - DOMAIN-SUFFIX,byteoversea.com,节点选择
  - DOMAIN-SUFFIX,ibytedtos.com,节点选择

  # AI / OpenAI / ChatGPT
  - DOMAIN-SUFFIX,openai.com,节点选择
  - DOMAIN-SUFFIX,chatgpt.com,节点选择
  - DOMAIN-SUFFIX,oaistatic.com,节点选择
  - DOMAIN-SUFFIX,oaiusercontent.com,节点选择
  - DOMAIN-SUFFIX,ai.com,节点选择
  - DOMAIN-KEYWORD,chatgpt,节点选择
  - DOMAIN-KEYWORD,openai,节点选择

  # Claude / Anthropic
  - DOMAIN-SUFFIX,anthropic.com,节点选择
  - DOMAIN-SUFFIX,claude.ai,节点选择
  - DOMAIN-KEYWORD,claude,节点选择

  # Gemini / Google AI
  - DOMAIN-SUFFIX,gemini.google.com,节点选择
  - DOMAIN-SUFFIX,ai.google.dev,节点选择
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,节点选择
  - DOMAIN-KEYWORD,gemini,节点选择

  # Perplexity / Poe / Cursor / Copilot
  - DOMAIN-SUFFIX,perplexity.ai,节点选择
  - DOMAIN-SUFFIX,poe.com,节点选择
  - DOMAIN-SUFFIX,cursor.com,节点选择
  - DOMAIN-SUFFIX,cursor.sh,节点选择
  - DOMAIN-SUFFIX,githubcopilot.com,节点选择
  
  ### 2. 拒绝类规则
  - RULE-SET,reject_non_ip,REJECT
  - RULE-SET,reject_domainset,REJECT
  - RULE-SET,reject_non_ip_drop,REJECT-DROP
  - RULE-SET,reject_non_ip_no_drop,REJECT
  - RULE-SET,reject_ip,REJECT

  ### 3. 局域网 / 国内流量直连，不走代理

  ### 局域网 / 国内直连
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,lan_ip,DIRECT,no-resolve

  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,cn,DIRECT
  - RULE-SET,domestic_ip,DIRECT
  - RULE-SET,china_ip,DIRECT

  - RULE-SET,apple_cdn,DIRECT
  - RULE-SET,apple_cn_non_ip,DIRECT
  - RULE-SET,microsoft_cdn_non_ip,DIRECT

  ### 4. 其他需要代理的流量全部走香港自动

  # Telegram
  - RULE-SET,telegram_non_ip,🇭🇰 香港自动
  - RULE-SET,telegram_ip,🇭🇰 香港自动,no-resolve

  # 流媒体
  - RULE-SET,stream_non_ip,🇭🇰 香港自动
  - RULE-SET,stream_ip,🇭🇰 香港自动

  # CDN / 全球站点
  - RULE-SET,cdn_domainset,🇭🇰 香港自动
  - RULE-SET,cdn_non_ip,🇭🇰 香港自动
  - RULE-SET,global_non_ip,🇭🇰 香港自动

  # Apple / Microsoft 非国内服务，如需要代理可以走香港自动
  - RULE-SET,apple_services,🇭🇰 香港自动
  - RULE-SET,microsoft_non_ip,🇭🇰 香港自动

  ### 5. 兜底
  - MATCH,🇭🇰 香港自动
