### 参考自 https://github.com/yyhhyyyyyy/selfproxy
### 全局配置
mixed-port: 7897
allow-lan: true
mode: rule
log-level: warning
ipv6: false
find-process-mode: strict
### 如果使用的是裸核，需要将下面的注释去掉，方便ui界面的使用
# external-controller: 0.0.0.0:9988
# external-ui: ui
# external-ui-url: 'https://testingcf.jsdelivr.net/gh/Zephyruso/zashboard@releases/latest/download/dist.zip'
# secret: "114514yijiuyijiubayiling"

profile:
  store-selected: true
  store-fake-ip: true
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

### DNS配置
dns:
  enable: true
  listen: 0.0.0.0:53
  ipv6: false
  prefer-h3: true
  enhanced-mode: fake-ip
  use-hosts: true
  use-system-hosts: true
  nameserver:
    - https://223.5.5.5/dns-query
    - https://dns.pub/dns-query
    - https://dns.flymc.cc/dns-query
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['rule-set:fakeip-filter,trackerslist,private,cn']
  nameserver-policy:
    {'rule-set:reject_non_ip,reject_domainset,reject_non_ip_drop,reject_non_ip_no_drop': [rcode://success]}

### 域名嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - dlg.io.mi.com
    - "+.push.apple.com"

### Tun 配置（按需开启）
tun:
  enable: false
  stack: system
  device: Ethernet 99
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  mtu: 1500
  # 如果有使用 zerotier/headscale 等，需要自己配置排除网段
  # route-exclude-address: ["192.168.110.0/24"]

# ==========================
# 节点筛选（正则）
# ==========================

# 基础过滤：过滤套餐、官网、流量、到期、客服等信息节点
FilterAll: &FilterAll '^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author)\b|(\d{4}-\d{2}-\d{2}|\d+G)))).*$'

# 个人 / 机场 区分
# 个人节点：必须包含 自建 或 Personal
FilterPersonal: &FilterPersonal '^(?=.*(自建|Personal))(?=.*).*$'

# 全部个人节点，但排除香港直连节点
# 注意：不会排除「自建MY车1(HK车1中转)」这类落地节点
FilterPersonalNoHK: &FilterPersonalNoHK '^(?=.*(自建|Personal))(?!.*(机场|\[机场HK\]|🇭🇰|自建HK|香港|Hong)).*$'

# 机场节点：不包含 自建 / Personal
FilterAirport: &FilterAirport '^(?=.*(.))(?!.*(自建|Personal)).*$'

# 个人节点按国家拆分
# 注意：这些都只匹配 自建 / Personal，因此机场节点不会参与

# 香港个人节点：只匹配真正香港直连节点
FilterPersonalHK: &FilterPersonalHK '^(?=.*(自建|Personal))(?=.*(🇭🇰|自建HK|香港|Hong))(?!.*(HK车.*中转|HK中转|中转3|MY|马来|马来西亚|TH|泰国|ID|印尼|印度尼西亚|US|美国|美國|United States|USA|SG|新加坡|🇲🇾|🇹🇭|🇮🇩|🇺🇸|🇸🇬|机场|\[机场HK\])).*$'

# 马来个人节点
FilterPersonalMY: &FilterPersonalMY '(自建|Personal).*(马来|马来西亚|Malaysia|MY|吉隆坡|Kuala Lumpur|KL|🇲🇾)|(马来|马来西亚|Malaysia|MY|吉隆坡|Kuala Lumpur|KL|🇲🇾).*(自建|Personal)'

# 泰国个人节点
FilterPersonalTH: &FilterPersonalTH '(自建|Personal).*(泰国|Thailand|TH|曼谷|Bangkok|🇹🇭)|(泰国|Thailand|TH|曼谷|Bangkok|🇹🇭).*(自建|Personal)'


# 其他国家个人：排除马来、泰国、香港直连；但保留 HK车中转后的其他国家落地节点
FilterPersonalOther: &FilterPersonalOther '^(?=.*(自建|Personal))(?!.*(机场|\[机场HK\]|🇲🇾|MY|马来|马来西亚|Malaysia|吉隆坡|Kuala Lumpur|KL|🇹🇭|TH|泰国|Thailand|曼谷|Bangkok)).*$'

# 指纹浏览器固定节点筛选
FilterFP_MY1: &FilterFP_MY1 '^(?=.*自建MY1.*H1中转.*01).*$'
FilterFP_TH1: &FilterFP_TH1 '^(?=.*自建TH1.*H1中转.*01).*$'
FilterFP_ID1: &FilterFP_ID1 '^(?=.*自建ID2.*H2中转.*01).*$'

# 公共模板
Select: &Select {type: select, url: 'http://cp.cloudflare.com/generate_204', disable-udp: false, hidden: false, include-all: true}
Auto: &Auto {type: url-test, url: 'http://cp.cloudflare.com/generate_204', interval: 60, tolerance: 50, disable-udp: false, hidden: true, include-all: true}
Loadbalance: &Loadbalance {type: load-balance, url: 'http://cp.cloudflare.com/generate_204', interval: 60, strategy: round-robin, disable-udp: false, hidden: true, include-all: true}

# ==========================
# 策略组
# ==========================
proxy-groups:
  - name: 节点选择
    type: select
    proxies:
      - 🇭🇰 香港自动
      - 个人节点
      - 🇲🇾 马来个人
      - 🇹🇭 泰国个人
      - 🌍 其他国家个人
      - 🇭🇰 香港个人
      - 机场节点
      - DIRECT
    url: http://cp.cloudflare.com/generate_204
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f310.png

  - name: 🇭🇰 香港自动
    <<: *Auto
    filter: *FilterPersonalHK
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/HK.png

  - name: 个人节点
    <<: *Select
    filter: *FilterPersonalNoHK
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f464.png

  - name: 🇲🇾 马来个人
    <<: *Select
    filter: *FilterPersonalMY
    exclude-filter: '机场|\[机场HK\]'
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f1f2-1f1fe.png

  - name: 🇹🇭 泰国个人
    <<: *Select
    filter: *FilterPersonalTH
    exclude-filter: '机场|\[机场HK\]'
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/TH.png

  - name: 🌍 其他国家个人
    <<: *Select
    filter: *FilterPersonalOther
    exclude-filter: '机场|\[机场HK\]'
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/Global.png
    
  - name: 🇭🇰 香港个人
    <<: *Select
    filter: *FilterPersonalHK
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f1ed-1f1f0.png
    
  - name: 机场节点
    <<: *Select
    filter: *FilterAirport
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f6eb.png


  # ==========================
  # 指纹浏览器固定端口策略组
  # 一个策略组 = 一个固定节点
  # ==========================

  - name: 指纹-MY1
    <<: *Select
    filter: *FilterFP_MY1
    icon: https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/1f1f2-1f1fe.png

  - name: 指纹-TH1
    <<: *Select
    filter: *FilterFP_TH1
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/TH.png
    
  - name: 指纹-ID1
    <<: *Select
    filter: *FilterFP_ID1
    icon: https://testingcf.jsdelivr.net/gh/Orz-3/mini@master/Color/ID.png

# ==========================
# 指纹浏览器专用本地端口
# 这些端口不会影响你原来的 7897 正常使用
# ==========================
listeners:
  - name: fp-my1
    type: http
    listen: 127.0.0.1
    port: 31001
    udp: true
    proxy: 指纹-MY1

  - name: fp-th1
    type: http
    listen: 127.0.0.1
    port: 31002
    udp: true
    proxy: 指纹-TH1

  - name: fp-id1
    type: http
    listen: 127.0.0.1
    port: 31003
    udp: true
    proxy: 指纹-ID1


# ==========================
# 规则配置 rule-providers
# ==========================
